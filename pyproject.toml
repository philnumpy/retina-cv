[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore:.*pin_memory.*:UserWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# real errors only (pyflakes + syntax / runtime pitfalls); the compact one-line style is intentional
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731"]
