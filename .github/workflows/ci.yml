name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src scripts tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          # requirements.txt pins the CUDA build of ONNX Runtime; CI has no GPU
          sed -e 's/onnxruntime-gpu==\([0-9.]*\).*/onnxruntime==\1/' -e '/^kaggle/d' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest
      - name: Run tests
        run: pytest
